<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex" /><title>HerStep Admin</title><link rel="stylesheet" href="styles.css" /></head>
<body class="admin-page"><main class="admin-shell"><header class="admin-header"><a class="brand" href="/">HERSTEP <span>COLLECTION</span></a><div><span id="admin-identity">Secure administrator access</span><button class="button button-secondary" id="admin-sign-out" type="button" hidden>Sign out</button></div></header><section id="admin-login"><p class="eyebrow">Administration</p><h1>Manage HerStep.</h1><p>Sign in with an authorised administrator account to view live operations.</p><button class="button" id="admin-sign-in" type="button">Sign in</button></section><section id="admin-content" hidden aria-live="polite">Loading dashboard.</section></main><dialog class="auth-dialog" id="admin-auth" aria-labelledby="admin-auth-title"><button class="dialog-close" id="admin-auth-close" type="button" aria-label="Close sign in">×</button><h2 id="admin-auth-title">Administrator sign in</h2><form id="admin-auth-form"><label>Email address<input name="email" type="email" autocomplete="email" required /></label><label>Password<input name="password" type="password" autocomplete="current-password" required /></label><p class="form-message" role="alert"></p><button class="button" type="submit">Sign in</button></form></dialog><script type="module" src="admin.js"></script></body></html>
